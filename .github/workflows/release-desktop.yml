name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run desktop:build:win
            artifact: PicLite-Windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            command: npm run desktop:build:mac:arm64
            artifact: PicLite-macOS-arm64
          - name: macOS Intel
            os: macos-15-intel
            command: npm run desktop:build:mac:x64
            artifact: PicLite-macOS-x64
          - name: Linux x64
            os: ubuntu-latest
            command: npm run desktop:build:linux:x64
            artifact: PicLite-Linux-x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            command: npm run desktop:build:linux:arm64
            artifact: PicLite-Linux-arm64

    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-logs
          path: |
            release/builder-debug.yml
            release/builder-effective-config.yaml
            ~/.npm/_logs/*.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" --generate-notes --repo "${GITHUB_REPOSITORY}"
          fi
