services:
  piclite:
    build:
      context: .
    image: piclite:local
    container_name: piclite
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3456
    ports:
      - "127.0.0.1:3456:3456"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3456/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
