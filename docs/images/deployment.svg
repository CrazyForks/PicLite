<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">PicLite 服务器部署结构</title>
  <desc id="desc">浏览器通过 HTTPS 连接 Nginx，Nginx 反向代理到运行 PicLite 的 Docker 容器，图片始终在浏览器本地处理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#4169e1"/>
      <stop offset="1" stop-color="#7657e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#27406c" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7c9e"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <text x="60" y="64" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#18233a">PicLite 自托管结构</text>
  <text x="60" y="96" font-family="system-ui, sans-serif" font-size="16" fill="#60708f">界面由服务器提供，图片在用户浏览器本地压缩，不上传原图</text>

  <g filter="url(#shadow)">
    <rect x="62" y="145" width="270" height="170" rx="22" fill="#fff"/>
    <circle cx="118" cy="200" r="27" fill="#edf2ff"/>
    <path d="M101 195h34v22h-34zm5-11h24v11h-24z" fill="none" stroke="#4169e1" stroke-width="4" stroke-linejoin="round"/>
    <text x="100" y="258" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#18233a">用户浏览器</text>
    <text x="100" y="287" font-family="system-ui, sans-serif" font-size="15" fill="#60708f">本地读取 · 本地压缩 · 本地导出</text>

    <rect x="466" y="145" width="270" height="170" rx="22" fill="#fff"/>
    <circle cx="522" cy="200" r="27" fill="#edf2ff"/>
    <path d="M508 212v-23h28v23m-34 0h40" fill="none" stroke="#4169e1" stroke-width="4" stroke-linecap="round"/>
    <text x="504" y="258" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#18233a">Nginx + HTTPS</text>
    <text x="504" y="287" font-family="system-ui, sans-serif" font-size="15" fill="#60708f">域名与 TLS 反向代理</text>

    <rect x="870" y="145" width="270" height="170" rx="22" fill="#fff"/>
    <circle cx="926" cy="200" r="27" fill="#edf2ff"/>
    <rect x="911" y="185" width="30" height="30" rx="6" fill="none" stroke="#4169e1" stroke-width="4"/>
    <path d="M917 193h18m-18 7h18m-18 7h12" stroke="#4169e1" stroke-width="3" stroke-linecap="round"/>
    <text x="908" y="258" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#18233a">PicLite 容器</text>
    <text x="908" y="287" font-family="system-ui, sans-serif" font-size="15" fill="#60708f">Node.js · 127.0.0.1:3000</text>
  </g>

  <path d="M347 230h98" fill="none" stroke="#6b7c9e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="366" y="211" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#60708f">HTTPS</text>
  <path d="M751 230h98" fill="none" stroke="#6b7c9e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="759" y="211" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#60708f">反向代理</text>

  <rect x="60" y="356" width="1080" height="1" fill="#d7deee"/>
  <circle cx="73" cy="386" r="5" fill="url(#brand)"/>
  <text x="90" y="392" font-family="system-ui, sans-serif" font-size="15" fill="#60708f">Docker Compose 负责启动、健康检查与自动重启；GitHub Actions 可通过 SSH 执行更新。</text>
</svg>
